[project]
name = "worldgen"
version = "0.1.0"
description = "Local-first world package prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
worldgen = "worldgen.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
