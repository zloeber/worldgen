[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldgen"
version = "0.1.0"
description = "Local-first world package prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1.8",
  "jsonschema>=4.23.0",
  "litellm>=1.74.0",
]

[project.scripts]
worldgen = "worldgen.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
